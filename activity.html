<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活動</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{--cream:#f8f2e4;--paper:#fffaf0;--ink:#3a3330;--red:#c0392b;--muted:#7d716a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--cream);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 16px;text-align:center}
h1{font-family:"Noto Serif TC",serif;font-size:clamp(40px,8vw,72px);color:var(--red);letter-spacing:.15em}
p{font-size:20px;color:var(--muted)}
a{display:inline-block;margin-top:12px;padding:12px 28px;background:var(--paper);border-radius:999px;color:var(--ink);text-decoration:none;
  box-shadow:0 4px 14px rgba(58,51,48,.12);font-size:18px}
a:hover{color:var(--red)}
</style>
</head>
<body>
  <h1>活動</h1>
  <p>內容準備中，敬請期待。</p>
  <a href="index.html">← 回首頁</a>

</html>
