<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寶石鑑定室</title>
<link rel="preload" href="fonts/Iansui.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Iansui";src:url("fonts/Iansui.woff2") format("woff2");font-weight:100 900;font-display:block}.ptxt{display:inline-block;vertical-align:middle;width:auto;max-width:100%;object-fit:contain}
.ptxt.pl{display:block;margin:0 auto}.ptxt.pl+.ptxt.pl{margin-top:.1em}
</style>
<style>
:root{--cream:#f8f2e4;--paper:#fffaf0;--pink:#ecc7bd;--ink:#3a3330;--red:#c0392b;--muted:#7d716a;--line:rgba(58,51,48,.14);
  --s1:#d9a441;--s2:#5aa0c8;--s3:#7fae5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:"Iansui",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100%}
body.scroll{overflow:auto;height:auto;min-height:100%}
button{font:inherit;color:inherit}
.ptxt{display:inline-block;vertical-align:middle;width:auto;max-width:100%;object-fit:contain}
.ptxt.pl{display:block;margin:0 auto}.ptxt.pl+.ptxt.pl{margin-top:.1em}
header{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(248,242,228,.96);flex-wrap:wrap}
header .logo{height:44px;width:auto;border-radius:8px;background:#fff}
h1{font-size:clamp(22px,2.6vw,34px);line-height:1}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cats a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-size:16px;border:3px solid transparent;box-shadow:0 2px 6px rgba(58,51,48,.1)}
.cats a i{width:12px;height:12px;border-radius:50%;display:inline-block}
.cats a.on{border-color:var(--red);font-weight:700}
.sp{flex:1}
.btn{border:0;border-radius:999px;padding:9px 20px;font-size:17px;font-weight:700;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(192,57,43,.25);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(58,51,48,.12);font-size:14px;padding:7px 14px}
#board{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:clamp(14px,2vw,28px);padding:clamp(16px,3vh,40px) 16px;max-width:1500px;margin:0 auto;width:100%}
.cat,.tp{position:relative;background:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(58,51,48,.12);border:3px solid #fff;border-bottom:8px solid var(--sc);transition:transform .15s,border-color .15s,box-shadow .15s;
  animation:in .45s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes in{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.cat{width:clamp(220px,24vw,340px);height:clamp(130px,17vh,180px);border-radius:24px;font-size:clamp(30px,3vw,44px)}
.tp{width:clamp(170px,17vw,250px);height:clamp(100px,13vh,130px);border-radius:18px;font-size:clamp(17px,1.6vw,23px);padding:10px}
.cat:hover,.tp:hover,.cat:focus-visible,.tp:focus-visible{transform:translateY(-4px);border-color:var(--sc);box-shadow:0 10px 24px rgba(58,51,48,.18);outline:none}
.tp .no{position:absolute;left:10px;top:7px;color:#b5aaa2;font-size:13px}
.tp .pg{position:absolute;right:10px;top:7px;color:#b5aaa2;font-size:12px}
.tp.seen .no::after{content:" ✓";color:#3c8d5a}
.tp.hot,.cat.hot{border-color:var(--red);transform:scale(1.08);box-shadow:0 12px 30px rgba(192,57,43,.35);z-index:4}
#pick{position:fixed;inset:0;background:rgba(30,26,24,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#pick.hidden{display:none}
.pbox{background:var(--paper);border-radius:28px;padding:26px;width:min(560px,100%);text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.pbox .t{font-size:16px;color:var(--muted)}
.pbox img.ph{width:100%;max-height:40vh;object-fit:cover;border-radius:16px}
.pbox .nm{font-size:clamp(30px,5vw,44px)}
.pbox .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<header>
  <img class="logo" src="img/gems-cover.jpg" alt="">
  <h1 id="title" aria-label="寶石鑑定室"></h1>
  <nav class="cats" id="cats"></nav>
  <span class="sp"></span>
  <button class="btn" id="bRand">🎲 隨機抽一個</button>
  <button class="btn ghost" id="bReset" title="清除已看過的勾勾">清除 ✓</button>
  <a class="btn ghost" href="index.html">首頁</a>
</header>
<main id="board"></main>
<div id="pick" class="hidden"><div class="pbox">
  <div class="t" id="pT">抽到了！</div>
  <div class="nm" id="pNm"></div>
  <div class="row"><a class="btn" id="pGo">開始 ▶</a><button class="btn ghost" id="pAgain">再抽一次</button><button class="btn ghost" id="pClose">關閉</button></div>
</div></div>
<script src="img/txt/ptxt.js"></script>
<script>
const TOPICS = [{"n": 1, "label": "輔導技能", "img": "img/gems/t01.jpg", "sec": 1, "pages": 1}, {"n": 2, "label": "幼小跨階段\n參觀", "img": "img/gems/t02.jpg", "sec": 1, "pages": 1}, {"n": 3, "label": "幼小跨階段\n轉銜", "img": "img/gems/t03.jpg", "sec": 1, "pages": 1}, {"n": 4, "label": "評量方式與標準\n及獨立考場", "img": "img/gems/t04.jpg", "sec": 1, "pages": 1}, {"n": 5, "label": "親師溝通", "img": "img/gems/t05.jpg", "sec": 1, "pages": 1}, {"n": 6, "label": "國中跨階段\n參觀", "img": "img/gems/t06.jpg", "sec": 1, "pages": 1}, {"n": 7, "label": "國中跨階段\n轉銜", "img": "img/gems/t07.jpg", "sec": 1, "pages": 1}, {"n": 8, "label": "小火車做到了", "img": "img/gems/t08.jpg", "sec": 2, "pages": 10}, {"n": 9, "label": "戲劇演出", "img": "img/gems/t09.jpg", "sec": 2, "pages": 13}, {"n": 10, "label": "文創商品", "img": "img/gems/t10.jpg", "sec": 2, "pages": 2}, {"n": 11, "label": "七股國小", "img": "img/gems/t11.jpg", "sec": 3, "pages": 2}, {"n": 12, "label": "光復國小", "img": "img/gems/t12.jpg", "sec": 3, "pages": 2}, {"n": 13, "label": "燈籠彩繪", "img": "img/gems/t13.jpg", "sec": 3, "pages": 2}, {"n": 14, "label": "南美館＋街道\n美術館＋普濟殿", "img": "img/gems/t14.jpg", "sec": 3, "pages": 5}, {"n": 15, "label": "Go touch\n寶可夢", "img": "img/gems/t15.jpg", "sec": 3, "pages": 1}, {"n": 16, "label": "我畫。畫我", "img": "img/gems/t16.jpg", "sec": 3, "pages": 5}, {"n": 17, "label": "防疫小尖兵", "img": "img/gems/t17.jpg", "sec": 3, "pages": 1}, {"n": 18, "label": "疫起後一起", "img": "img/gems/t18.jpg", "sec": 3, "pages": 1}, {"n": 19, "label": "巴克禮", "img": "img/gems/t19.jpg", "sec": 3, "pages": 4}, {"n": 20, "label": "活動存摺", "img": "img/gems/t20.jpg", "sec": 3, "pages": 1}, {"n": 21, "label": "成就解鎖卡牌", "img": "img/gems/t21.jpg", "sec": 3, "pages": 1}];
const SC=['','var(--s1)','var(--s2)','var(--s3)'];
const $=id=>document.getElementById(id);
$('title').innerHTML=ptxt('寶石鑑定室','#c0392b');
function visited(){try{return JSON.parse(localStorage.getItem('gems-visited')||'[]')}catch(e){return[]}}
const CATS=['','教師工作','自我賦能','走讀共學'];
const CQ=parseInt(new URLSearchParams(location.search).get('c'),10);const CAT=CQ>=1&&CQ<=3?CQ:0;
const LIST=CAT?TOPICS.filter(t=>t.sec===CAT):[];
$('cats').innerHTML=`<a href="gems.html" class="${CAT?'':'on'}">三大類</a>`+[1,2,3].map(c=>`<a href="gems.html?c=${c}" class="${CAT===c?'on':''}"><i style="background:${SC[c]}"></i>${CATS[c]}</a>`).join('');
if(CAT)document.title='寶石鑑定室・'+CATS[CAT];
function build(){
  const b=$('board');b.innerHTML='';const v=visited();
  if(!CAT){
    [1,2,3].forEach((c,i)=>{const el=document.createElement('a');el.className='cat';el.href='gems.html?c='+c;
      el.style.setProperty('--i',i);el.style.setProperty('--sc',SC[c]);el.innerHTML=ptxt(CATS[c],'#c0392b');b.appendChild(el)});
    return}
  LIST.forEach((t,i)=>{
    const el=document.createElement('a');el.className='tp'+(v.includes(t.n)?' seen':'');el.href='gemtalk.html?t='+t.n;el.dataset.n=t.n;
    el.style.setProperty('--i',i);el.style.setProperty('--sc',SC[t.sec]);el.title=t.label.replace(/\n/g,'');
    el.innerHTML=`${ptxt(t.label,'#6b4226')}<span class="no">${t.n}</span>${t.pages>1?`<span class="pg">${t.pages} 頁</span>`:''}`;
    b.appendChild(el)});
}
function layout(){}
addEventListener('resize',layout);
let rolling=false;
function roll(){
  if(rolling)return;rolling=true;$('pick').classList.add('hidden');
  const base=CAT?LIST:TOPICS;const v=visited();let pool=base.filter(a=>!v.includes(a.n));if(!pool.length)pool=base;
  const win=pool[Math.floor(Math.random()*pool.length)];
  const tiles=[...document.querySelectorAll(CAT?'.tp':'.cat')];let i=0,delay=60,prev=null;const total=20;
  (function tick(){
    prev&&prev.classList.remove('hot');
    const el=i>=total?(CAT?tiles.find(t=>+t.dataset.n===win.n):tiles[win.sec-1]):tiles[Math.floor(Math.random()*tiles.length)];
    el.classList.add('hot');if(document.body.classList.contains('scroll'))el.scrollIntoView({block:'nearest'});prev=el;i++;
    if(i<=total){delay*=1.1;setTimeout(tick,delay);return}
    setTimeout(()=>{el.classList.remove('hot');rolling=false;
      $('pNm').innerHTML=ptxt(win.label,'#6b4226');$('pT').textContent=`抽到了！第 ${win.n} 個主題`;
      $('pGo').href='gemtalk.html?t='+win.n;$('pick').classList.remove('hidden')},600)})();
}
$('bRand').onclick=roll;$('pAgain').onclick=roll;
$('pClose').onclick=()=>$('pick').classList.add('hidden');
$('bReset').onclick=()=>{try{localStorage.removeItem('gems-visited')}catch(e){};build()};
addEventListener('pageshow',e=>{if(e.persisted)build()});
build();
</script>
</body>
</html>
