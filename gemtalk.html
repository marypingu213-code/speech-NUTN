<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寶石鑑定室</title>
<link rel="preload" href="fonts/Iansui.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Iansui";src:url("fonts/Iansui.woff2") format("woff2");font-weight:100 900;font-display:block}</style>
<style>
:root{
  --cream:#f8f2e4; --paper:#fffaf0; --pink:#ecc7bd; --sage:#d9e3c5; --blue:#c8d4de; --sand:#f1e3bf;
  --ink:#3a3330; --red:#c0392b; --muted:#7d716a; --line:rgba(58,51,48,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#2b2724;overflow:hidden;font-family:"Iansui",system-ui,sans-serif;color:var(--ink)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;position:relative;transform-origin:center center;flex:none;overflow:hidden;background:var(--cream);box-shadow:0 10px 60px rgba(0,0,0,.4)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
/* background blobs drawn in SVG */
.bg{position:absolute;inset:0;z-index:0}
.content{position:absolute;inset:0;z-index:1}

/* header */
.hd{position:absolute;left:44px;top:30px;right:44px;height:92px;display:flex;align-items:center;gap:18px}
.hd .ic{height:84px;width:auto;max-width:150px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08))}
.hd h2{font-family:"Iansui",system-ui,sans-serif;font-weight:900;font-size:46px;color:var(--red);letter-spacing:.06em;line-height:1.15;white-space:pre-line}
.hd .no{margin-left:auto;font-size:18px;color:var(--muted);letter-spacing:.1em;align-self:flex-start;padding-top:12px}
.hd h2:empty{display:none}
.hd h2.two{font-size:36px}

/* photo gallery (justified rows, laid out by script) */
.gal{position:absolute;left:44px;right:44px;top:140px;bottom:44px}
.gal.notitle{top:44px}
.ph{position:absolute;overflow:hidden;border-radius:10px;background:#ddd;box-shadow:0 4px 14px rgba(58,51,48,.18);border:5px solid #fff;cursor:zoom-in;transition:transform .2s}
.ph:hover{transform:scale(1.015);z-index:2}
.ph img{position:absolute;display:block}
.ph .vb{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:15px;padding:3px 10px;border-radius:20px}
.note{position:absolute;right:44px;top:140px;bottom:44px;width:440px;background:var(--paper);border-radius:18px;padding:30px 34px;box-shadow:0 6px 20px rgba(58,51,48,.12);overflow:auto;border-left:8px solid var(--pink)}
.note p{font-size:23px;line-height:1.75;white-space:pre-line;margin-bottom:12px}
.has-note .gal{right:510px}
.note.long p{font-size:19px;line-height:1.6}
.hd .sub{font-size:24px;color:var(--muted);margin-left:10px;letter-spacing:.08em}

/* cover */
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cover h1{font-family:"Iansui",system-ui,sans-serif;font-weight:900;font-size:150px;line-height:1.1;text-align:center;letter-spacing:.05em}
.cover h1 .n{color:var(--red);font-family:"Iansui",system-ui,sans-serif;font-weight:900;font-size:160px;display:inline-block;transform:translateY(14px) rotate(-6deg);margin:0 6px}
.cover .who{margin-top:56px;font-family:"Iansui",system-ui,sans-serif;font-size:38px;text-align:center;line-height:1.5;color:#4b423d}
.cover .tag{margin-top:24px;font-size:20px;letter-spacing:.4em;color:var(--muted)}

/* goals */
.goals{position:absolute;left:70px;right:70px;top:150px;bottom:40px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.goal{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15);background:#fff}
.goal img{width:100%;height:100%;object-fit:cover;display:block}
.goal span{position:absolute;left:38%;right:4px;top:4px;font-size:15px;line-height:1.25;color:#fff;font-weight:700;white-space:pre-line;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.goal.logo span{display:none}
.banner{position:absolute;top:28px;left:50%;transform:translateX(-50%);height:104px}

.hero{position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center}
.hero img{width:100%;height:100%;object-fit:contain;display:block}
/* single image */
.full{position:absolute;inset:50px 90px;display:flex;align-items:center;justify-content:center}
.full img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#fff}

/* picture-book pages */
.book{position:absolute;inset:34px 60px;display:flex;align-items:center;justify-content:center}
.book img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.book-title{position:absolute;left:44px;top:34px;font-family:"Iansui",system-ui,sans-serif;font-weight:900;font-size:46px;color:var(--red);z-index:3}
.burst{position:absolute;z-index:3;width:440px;height:330px;display:flex;align-items:center;justify-content:center;
  clip-path:polygon(50% 0%,58% 22%,78% 6%,72% 30%,98% 24%,80% 44%,100% 58%,76% 62%,88% 88%,64% 74%,56% 100%,46% 78%,26% 96%,30% 70%,2% 78%,20% 56%,0% 38%,24% 34%,12% 8%,38% 22%);
  background:var(--red);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.burst::before{content:"";position:absolute;inset:7px;background:#fff;clip-path:inherit}
.burst b{position:relative;font-family:"Iansui",system-ui,sans-serif;font-size:46px;color:var(--red);white-space:pre-line;text-align:center;line-height:1.3}
@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}

/* topic map */
.map{position:absolute;inset:0}
.bub{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Iansui",system-ui,sans-serif;font-weight:900;color:var(--ink);box-shadow:0 8px 24px rgba(58,51,48,.12);border:4px solid #fff}
.map .center{font-size:40px;color:#fff;background:var(--red)}

/* list */
.listcard{position:absolute;left:130px;top:190px;right:520px;bottom:90px;background:var(--paper);border-radius:22px;padding:50px 70px;box-shadow:0 10px 30px rgba(58,51,48,.12)}
.listcard li{list-style:none;font-size:40px;line-height:2.05;display:flex;align-items:center;gap:22px}
.listcard li::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--red);flex:none}

/* timeline */
.tl{position:absolute;left:60px;right:60px;top:150px;bottom:50px}
.tl svg{position:absolute;inset:0;overflow:visible}
.node{position:absolute;width:150px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.node .dot{width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(58,51,48,.15);border:3px solid var(--pink);transition:transform .2s}
.node:hover .dot{transform:scale(1.12);border-color:var(--red)}
.node .dot img{max-width:68px;max-height:68px}
.node .lb{font-size:17px;font-weight:700;line-height:1.25;white-space:pre-line;color:#5a4a43}
.node .num{position:absolute;top:-6px;right:22px;background:var(--red);color:#fff;font-size:13px;border-radius:12px;padding:1px 7px}

/* thanks */
.thanks{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.thanks h1{font-family:"Iansui",system-ui,sans-serif;font-weight:900;font-size:110px;line-height:1.15;text-align:center;letter-spacing:.03em}
.thanks .jd{margin-top:40px;font-size:66px;font-weight:900;font-style:italic;color:var(--red)}

/* section card for empty slides */
.empty{position:absolute;inset:150px 44px 44px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;color:var(--muted);font-size:26px}
.empty .big{width:220px;height:220px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(58,51,48,.12)}
.empty .big img{max-width:150px;max-height:150px}

/* controls */
#ui{position:fixed;right:16px;bottom:14px;display:flex;gap:8px;align-items:center;z-index:50;opacity:.25;transition:opacity .3s}
#ui:hover{opacity:1}
#ui button{background:rgba(255,255,255,.92);border:0;border-radius:22px;height:40px;min-width:44px;padding:0 14px;font-size:17px;cursor:pointer;font-family:inherit;color:var(--ink)}
#ui .pg{color:#fff;font-size:16px;min-width:76px;text-align:center}
#prog{position:fixed;left:0;bottom:0;height:4px;background:var(--red);z-index:50;transition:width .3s}

/* overview */
#ov{position:fixed;inset:0;background:rgba(30,26,24,.96);z-index:60;display:none;overflow:auto;padding:30px}
#ov.on{display:block}
#ov .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
#ov .t{background:var(--cream);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:90px;display:flex;gap:10px;align-items:center;border:3px solid transparent}
#ov .t.cur{border-color:var(--red)}
#ov .t img{width:60px;height:60px;object-fit:contain;flex:none}
#ov .t b{font-size:13px;color:var(--muted);display:block}
#ov .t span{font-size:16px;font-weight:700;white-space:pre-line;line-height:1.3}

/* lightbox */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:70;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:94vh;border-radius:6px}
</style>
</head>

const URLS = {};               // filename -> blob url
const PACKS = [];              // promise per pack
function loadPack(i){ if(!PACKS[i]) PACKS[i]=fetch('pack/p'+i+'.json').then(r=>r.json()).then(j=>{const bin=atob(j.b64),buf=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)buf[k]=bin.charCodeAt(k);
    for(const [f,[p,o,l]] of Object.entries(PACKIDX)) if(p===i){URLS[f]=URL.createObjectURL(new Blob([buf.slice(o,o+l)],{type:f.endsWith('.png')?'image/png':'image/jpeg'}))}
    document.querySelectorAll('img[data-src]').forEach(im=>{const u=URLS[im.dataset.src];if(u){im.src=u;im.removeAttribute('data-src')}});
  }).catch(e=>{console.warn('pack',i,e);PACKS[i]=null}); return PACKS[i]}
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACw=';
function src(f){ if(URLS[f]) return `src="${URLS[f]}"`; const p=PACKIDX[f]; if(p) loadPack(p[0]); return `src="${BLANK}" data-src="${f}"`; }

/* ---------- background blobs (deterministic per slide) ---------- */
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
const COLORS=['#ecc7bd','#d9e3c5','#c8d4de','#f1e3bf'];
function blobPath(cx,cy,r,R){const n=7,pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r*(0.75+R()*0.45);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}
  let d='';for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    if(i===0)d+=`M${p1[0].toFixed(0)},${p1[1].toFixed(0)}`;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(0)},${c1[1].toFixed(0)} ${c2[0].toFixed(0)},${c2[1].toFixed(0)} ${p2[0].toFixed(0)},${p2[1].toFixed(0)}`}
  return d+'Z'}
function bg(i){const R=rnd(i*7919+13);const spots=[[1600,620,330],[80,820,260],[700,-40,170],[1480,120,200],[420,960,240]];
  let s='<svg class="bg" viewBox="0 0 1600 900" preserveAspectRatio="none">';
  spots.forEach((p,k)=>{s+=`<path d="${blobPath(p[0]+(R()-.5)*120,p[1]+(R()-.5)*80,p[2],R)}" fill="${COLORS[(k+i)%4]}" opacity=".75"/>`});
  s+=`<path d="M-20,${300+R()*200} C400,${200+R()*200} 700,${600+R()*200} 1620,${380+R()*200}" stroke="#8a7f78" stroke-opacity=".25" fill="none" stroke-width="1.5"/>`;
  return s+'</svg>'}

const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function header(d,i){const ic=(d.icons||[]).map(f=>`<img class="ic" ${src(f)} alt="">`).join('');
  return `<div class="hd">${ic}<h2 class="${(d.title||'').includes('\n')?'two':''}">${esc(d.title)}</h2><span class="no">${String(i+1).padStart(3,'0')}</span></div>`}
function imgTag(p){ // crop via positioning
  if(!p.c) return `<img ${src(p.f)} style="left:0;top:0;width:100%;height:100%;object-fit:cover" alt="">`;
  const [l,t,r,b]=p.c,w=1-l-r,h=1-t-b;
  return `<img ${src(p.f)} style="width:${100/w}%;height:${100/h}%;left:${-l/w*100}%;top:${-t/h*100}%" alt="">`}

/* justified layout: pick row count that best fills the box */
function justify(ph,W,H,gap){const n=ph.length;if(!n)return[];let best=null;
  for(let rows=1;rows<=Math.min(n,4);rows++){
    // split into rows with roughly equal summed aspect, keeping order
    const tot=ph.reduce((s,p)=>s+p.a,0),target=tot/rows,R=[];let cur=[],acc=0;
    ph.forEach((p,k)=>{cur.push(k);acc+=p.a;const left=n-k-1,need=rows-R.length-1;
      if((acc>=target*0.92&&R.length<rows-1&&left>=need)||left===need&&need>0&&R.length<rows-1){R.push(cur);cur=[];acc=0}});
    if(cur.length)R.push(cur);
    const hs=R.map(r=>(W-gap*(r.length-1))/r.reduce((s,k)=>s+ph[k].a,0));
    const totalH=hs.reduce((a,b)=>a+b,0)+gap*(R.length-1);
    const scale=Math.min(1,H/totalH);
    const fill=(totalH*scale)/H*Math.min(1,1/((totalH*scale)/H))*scale; // area used
    const score=scale*scale*totalH; // area actually covered
    if(!best||score>best.score*1.04)best={R,hs,scale,score,totalH};
  }
  const {R,hs,scale,totalH}=best,out=[];let y=(H-totalH*scale)/2;
  R.forEach((r,ri)=>{const h=hs[ri]*scale,rowW=r.reduce((s,k)=>s+ph[k].a*h,0)+gap*(r.length-1);let x=(W-rowW)/2;
    r.forEach(k=>{const w=ph[k].a*h;out[k]={x,y,w,h};x+=w+gap});y+=h+gap});
  return out}

   const pos=nodes.map((n,k)=>{const r=Math.floor(k/cols),c=k%cols,cc=r%2?cols-1-c:c;return[ (cc+.5)*W/cols, rowsN===1?H/2:(r*(H-120)/(rowsN-1))+60 ]});
   let path='';pos.forEach((p,k)=>{if(!k){path=`M${p[0]},${p[1]}`;return}const q=pos[k-1];
     if(q[1]===p[1])path+=` L${p[0]},${p[1]}`;else{const dx=(Math.floor(k/cols)%2?1:-1)*-90;path+=` C${q[0]+dx},${q[1]} ${p[0]+dx},${p[1]} ${p[0]},${p[1]}`}});
   return header(d,d._i)+`<div class="tl"><svg viewBox="0 0 ${W} ${H}"><path d="${path}" stroke="#c0392b" stroke-opacity=".35" stroke-width="6" fill="none" stroke-dasharray="1 14" stroke-linecap="round"/></svg>
   ${nodes.map((n,k)=>`<div class="node" data-go="${n.go}" style="left:${pos[k][0]}px;top:${pos[k][1]}px"><span class="num">${n.go+1}</span><div class="dot">${n.ic?`<img ${src(n.ic)} alt="">`:''}</div><div class="lb">${esc(n.t)}</div></div>`).join('')}</div>`},
 gallery(d,i){const nl=(d.notes||[]).join('').length;const has=nl>=40;let s=header(d,i);
   if(nl&&!has)s=s.replace('</h2>',`</h2><span class="sub">${esc(d.notes.join('　'))}</span>`);
   if(!d.photos.length){return s+`<div class="empty"><div class="big">${d.icons[0]?`<img ${src(d.icons[d.icons.length-1])} alt="">`:''}</div><div>（本主題無照片）</div></div>`}
   const notitle=!d.title&&!(d.icons||[]).length;
   s+=`<div class="gal ${notitle?'notitle':''}" data-i="${i}"></div>`;
   if(has)s+=`<div class="note ${nl>150?'long':''}">${d.notes.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;
   return s}
};

/* ---------- build ---------- */
// timeline nodes from section slides (those with an icon after the timeline)
(function(){const first=DECK.findIndex(d=>d.type==='timeline');const tls=DECK.map((d,i)=>[d,i]).filter(x=>x[0].type==='timeline');
  const secs=DECK.map((d,i)=>({d,i})).filter(x=>x.i>first+5&&x.d.type==='gallery'&&x.d.icons&&x.d.icons.length);
  const per=Math.ceil(secs.length/tls.length);
  tls.forEach(([d],k)=>{d.nodes=secs.slice(k*per,(k+1)*per).map(x=>({go:x.i,t:x.d.title,ic:x.d.icons[x.d.icons.length-1]}))});
})();
const els=DECK.map((d,i)=>{d._i=i;const el=document.createElement('section');el.className='slide';el.dataset.i=i;stage.appendChild(el);return el});
const built=new Set();
function build(i){if(i<0||i>=DECK.length||built.has(i))return;built.add(i);const d=DECK[i];
  els[i].innerHTML=(d.type==='hero'?'':bg(i))+`<div class="content ${d.type==='gallery'&&(d.notes||[]).join('').length>=40?'has-note':''}">${(R[d.type]||R.gallery)(d,i)}</div>`;
  const g=els[i].querySelector('.gal');
  if(g){const W=g.clientWidth||(1600-88-(d.notes?466:0)),H=g.clientHeight||(900-184);const gap=d.photos.length>8?12:18;
    const L=justify(d.photos,W,H,gap);
    g.innerHTML=d.photos.map((p,k)=>{const b=L[k];return `<div class="ph" data-f="${p.f}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px">${imgTag(p)}${p.v?'<span class="vb">▶ 影片</span>':''}</div>`}).join('')}
}
let cur=0;
function go(i){if(i>=DECK.length&&built.size){nextTopic();return}if(i<0&&built.size){prevTopic();return}i=Math.max(0,Math.min(DECK.length-1,i));[i-1,i,i+1,i+2].forEach(build);
  els[cur].classList.remove('on');cur=i;els[cur].classList.add('on');
  document.getElementById('pg').textContent=`${i+1} / ${DECK.length}`;
  document.getElementById('prog').style.width=((i+1)/DECK.length*100)+'%';
  try{history.replaceState(null,'','#p'+(i+1))}catch(e){location.hash='p'+(i+1)}}
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();

document.addEventListener('keydown',e=>{if(document.getElementById('lb').classList.contains('on')){if(e.key==='Escape')closeLb();return}
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(DECK.length-1);
  else if(e.key==='o'||e.key==='O')toggleOv();else if(e.key==='f'||e.key==='F')fs();
  else if(e.key==='Escape')document.getElementById('ov').classList.remove('on')});
stage.addEventListener('click',e=>{const n=e.target.closest('.node');if(n){go(+n.dataset.go);return}
  const p=e.target.closest('.ph');if(p){const lb=document.getElementById('lb');lb.querySelector('img').src=URLS[p.dataset.f]||BLANK;lb.classList.add('on');return}
  const r=stage.getBoundingClientRect();go(e.clientX>r.left+r.width*0.25?cur+1:cur-1)});
function closeLb(){document.getElementById('lb').classList.remove('on')}
document.getElementById('lb').onclick=closeLb;
document.getElementById('bPrev').onclick=()=>go(cur-1);
document.getElementById('bNext').onclick=()=>go(cur+1);
document.getElementById('bOv').onclick=toggleOv;
document.getElementById('bFs').onclick=fs;
document.getElementById('bRand').onclick=()=>{let v=[];try{v=JSON.parse(localStorage.getItem('gems-visited')||'[]')}catch(e){}
  let pool=TOPICS.map(a=>a.n).filter(n=>n!==TNUM&&!v.includes(n));if(!pool.length)pool=TOPICS.map(a=>a.n).filter(n=>n!==TNUM);
  location.href='gemtalk.html?t='+pool[Math.floor(Math.random()*pool.length)]};
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
let tx=null;stage.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){e.preventDefault();go(cur+(dx<0?1:-1))}tx=null});
function toggleOv(){const ov=document.getElementById('ov');if(ov.classList.toggle('on')){
  document.getElementById('ovg').innerHTML=DECK.map((d,i)=>{const ic=(d.icons&&d.icons[d.icons.length-1])||'';
    const t=d.title||(d.type==='cover'?'資源班的N種可能':d.type==='thanks'?'THANKS':d.type==='goals'?'OUR GOALS':d.type==='book'?'小火車做到了':d.type==='map'?'資源班老師的能力':'活動照片');
    return `<div class="t ${i===cur?'cur':''}" data-i="${i}">${ic?`<img ${src(ic)} alt="">`:''}<div><b>${i+1}</b><span>${esc(t)}</span></div></div>`}).join('');
  document.getElementById('ovg').querySelector('.cur')?.scrollIntoView({block:'center'})}}
document.getElementById('ovg').onclick=e=>{const t=e.target.closest('.t');if(t){document.getElementById('ov').classList.remove('on');go(+t.dataset.i)}};
const m=/^#p(\d+)$/.exec(location.hash);go(location.hash==='#end'?DECK.length-1:(m?+m[1]-1:0));
const PIDS=[...new Set(DECK.flatMap(d=>[...(d.photos||[]).map(p=>p.f),...(d.icons||[]),d.banner||''].filter(f=>PACKIDX[f]).map(f=>PACKIDX[f][0])))].sort((a,b)=>a-b);(async()=>{for(const i of PIDS)await loadPack(i)})();
</script>
</body>
