<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南台灣特教小太陽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{--cream:#f8f2e4;--paper:#fffaf0;--pink:#ecc7bd;--sage:#d9e3c5;--ink:#3a3330;--red:#c0392b;--muted:#7d716a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--cream);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(44px,9vw,96px);line-height:1.15;text-align:center;letter-spacing:.05em}
h1 .n{color:var(--red);font-family:"Noto Sans TC";display:inline-block;transform:rotate(-6deg);margin:0 .08em}
.who{margin-top:18px;font-size:clamp(17px,2.6vw,24px);color:var(--muted);text-align:center;line-height:1.6}
.choices{margin-top:56px;display:grid;grid-template-columns:repeat(3,minmax(0,260px));gap:28px;width:100%;justify-content:center}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:1/1;
  background:var(--paper);border-radius:28px;text-decoration:none;color:var(--ink);
  box-shadow:0 8px 24px rgba(58,51,48,.12);border:5px solid #fff;transition:transform .2s,box-shadow .2s,border-color .2s}
.choice:hover,.choice:focus-visible{transform:translateY(-6px);box-shadow:0 16px 34px rgba(58,51,48,.18);border-color:var(--red);outline:none}
.choice .ring{width:clamp(56px,9vw,84px);height:auto}
h1 .sun{color:var(--red)}
.choice.a b{white-space:nowrap;letter-spacing:.04em;font-size:clamp(24px,2.9vw,34px)}
.choice .ic{font-size:clamp(48px,9vw,76px);line-height:1}
.choice b{font-family:"Noto Serif TC",serif;font-size:clamp(26px,3.4vw,40px);color:var(--red);letter-spacing:.1em;text-align:center;line-height:1.25}
.choice span{font-size:clamp(14px,2vw,17px);color:var(--muted)}
.choice.a{background:linear-gradient(160deg,var(--paper),var(--sage))}
.choice.b{background:#fff;padding:12px;overflow:hidden}
.choice .cover{width:100%;height:auto;display:block}
.choice.c{background:linear-gradient(160deg,var(--paper),var(--pink))}
.teacher{margin-top:40px;color:var(--muted);font-size:14px;text-decoration:none;opacity:.7}
.teacher:hover{opacity:1;color:var(--red)}
@media (max-width:760px){.choices{grid-template-columns:1fr;max-width:300px}.choice{aspect-ratio:auto;padding:26px 16px}}
</style>
</head>
<body>
  <h1>南台灣<br>特教<span class="sun">小太陽</span></h1>
  <p class="who">台南市東區裕文國小　王峯文</p>
  <nav class="choices">
    <a class="choice a" href="activity.html"><img class="ic ring" src="img/sdg-ring.svg" alt=""><b>OUR GOALS<br>挑戰配對</b></a>
    <a class="choice b" href="gems.html" aria-label="寶石鑑定室"><img class="cover" src="img/gems-cover.jpg" alt="寶石鑑定室"></a>
    <a class="choice c" href="possibilities.html"><div class="ic">🌱</div><b>資源班的<br>N種可能</b></a>
  </nav>
  <a class="teacher" href="teacher.html">講師入口</a>
</body>
</html>
