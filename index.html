<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南台灣特教小太陽</title>
<link rel="preload" href="fonts/Iansui.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Iansui";src:url("fonts/Iansui.woff2") format("woff2");font-weight:100 900;font-display:block}.ptxt{display:inline-block;vertical-align:middle;width:auto;max-width:100%;object-fit:contain}
.ptxt.pl{display:block;margin:0 auto}.ptxt.pl+.ptxt.pl{margin-top:.1em}
</style>
<style>
:root{--cream:#f8f2e4;--paper:#fffaf0;--pink:#ecc7bd;--sage:#d9e3c5;--ink:#3a3330;--red:#c0392b;--muted:#7d716a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--cream);color:var(--ink);font-family:"Iansui",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px}
h1{font-family:"Iansui",system-ui,sans-serif;font-weight:900;font-size:clamp(48px,min(10vw,14vh),160px);line-height:1.12;text-align:center;letter-spacing:.05em}
h1 .n{color:var(--red);font-family:"Iansui",system-ui,sans-serif;display:inline-block;transform:rotate(-6deg);margin:0 .08em}
.who{margin-top:2vh;font-size:clamp(18px,min(2.6vw,3.6vh),34px);color:var(--muted);text-align:center;line-height:1.6}
.choices{margin-top:5vh;display:grid;grid-template-columns:repeat(3,min(29vw,40vh,420px));gap:clamp(20px,2.5vw,44px);width:100%;justify-content:center}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:1/1;
  background:var(--paper);border-radius:clamp(24px,2.4vw,40px);text-decoration:none;color:var(--ink);
  box-shadow:0 8px 24px rgba(58,51,48,.12);border:5px solid #fff;transition:transform .2s,box-shadow .2s,border-color .2s}
.choice:hover,.choice:focus-visible{transform:translateY(-6px);box-shadow:0 16px 34px rgba(58,51,48,.18);border-color:var(--red);outline:none}
.choice .ring{width:clamp(60px,min(9vw,13vh),130px);height:auto}
h1 .sun{color:var(--red)}
.choice.a b{white-space:nowrap;letter-spacing:.04em;font-size:clamp(24px,min(3vw,4.4vh),50px)}
.choice .ic{font-size:clamp(52px,min(9vw,12vh),120px);line-height:1}
.choice b{font-family:"Iansui",system-ui,sans-serif;font-size:clamp(26px,min(3.5vw,5vh),58px);color:var(--red);letter-spacing:.1em;text-align:center;line-height:1.25}
.choice span{font-size:clamp(14px,2vw,17px);color:var(--muted)}
.choice.a{background:linear-gradient(160deg,var(--paper),var(--sage))}
.choice.b{background:linear-gradient(160deg,var(--paper),#cfe6ea)}
.choice.c{background:linear-gradient(160deg,var(--paper),var(--pink))}
@media (max-width:760px){.choices{grid-template-columns:1fr;max-width:300px}.choice{aspect-ratio:auto;padding:26px 16px}}
</style>
</head>
<body>
  <h1>南台灣<br>特教<span class="sun">小太陽</span></h1>
  <nav class="choices">
    <a class="choice a" href="activity.html"><img class="ic ring" src="img/sdg-ring.svg" alt=""><b aria-label="OUR GOALS挑戰配對"><img class="ptxt pl" src="img/txt/15c1c4c331ac.png" alt="OUR GOALS" style="height:1.005em;aspect-ratio:4.34/1.005"><img class="ptxt pl" src="img/txt/b912b060defa.png" alt="挑戰配對" style="height:1.005em;aspect-ratio:3.895/1.005"></b></a>
    <a class="choice b" href="gems.html"><div class="ic">💎</div><b aria-label="寶石鑑定室"><img class="ptxt" src="img/txt/d6172124e96d.png" alt="寶石鑑定室" style="height:1.005em;aspect-ratio:4.74/1.005"></b></a>
    <a class="choice c" href="possibilities.html"><div class="ic">🌱</div><b aria-label="資源班的N種可能"><img class="ptxt pl" src="img/txt/bdbfdaaf6246.png" alt="資源班的" style="height:1.005em;aspect-ratio:3.775/1.005"><img class="ptxt pl" src="img/txt/7694027a9d73.png" alt="N種可能" style="height:1.005em;aspect-ratio:3.35/1.005"></b></a>
  </nav>
</body>
</html>
