<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資源班的N種可能</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{--cream:#f8f2e4;--paper:#fffaf0;--pink:#ecc7bd;--sage:#d9e3c5;--ink:#3a3330;--red:#c0392b;--muted:#7d716a;--line:rgba(58,51,48,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--cream);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(248,242,228,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1400px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:"Noto Serif TC",serif;font-size:clamp(22px,3.4vw,34px);color:var(--red);letter-spacing:.06em}
.count{color:var(--muted);font-size:15px}
.sp{flex:1}
.btn{border:0;border-radius:999px;padding:11px 22px;font-size:18px;font-weight:700;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(192,57,43,.25);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(58,51,48,.12);font-size:15px;padding:9px 16px}
main{max-width:1400px;margin:0 auto;padding:18px 16px 40px}
h2{font-size:17px;color:var(--muted);margin:18px 0 10px;font-weight:700;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.act{position:relative;background:#fff;border-radius:16px;padding:10px;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;
  box-shadow:0 3px 10px rgba(58,51,48,.1);border:3px solid transparent;cursor:pointer;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.act:hover,.act:focus-visible{transform:translateY(-3px);border-color:var(--pink);box-shadow:0 8px 20px rgba(58,51,48,.16);outline:none}
.act img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.act .no{position:absolute;left:6px;top:6px;background:var(--cream);color:var(--muted);font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}
.act.seen::after{content:"✓";position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:#3c8d5a;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.act.hot{border-color:var(--red);transform:scale(1.06);box-shadow:0 10px 26px rgba(192,57,43,.3);z-index:2}
.foot{margin-top:28px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#pick{position:fixed;inset:0;background:rgba(30,26,24,.8);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#pick.hidden{display:none}
.pbox{background:var(--paper);border-radius:26px;padding:26px;width:min(460px,100%);text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.pbox .lb{font-size:16px;color:var(--muted)}
.pbox img{width:min(300px,78vw);height:auto;max-height:46vh;object-fit:contain;background:#fff;border-radius:16px;padding:12px}
.pbox .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:8px}.act{padding:6px;border-radius:12px}.btn{font-size:16px;padding:9px 16px}}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1>資源班的N種可能</h1><span class="count" id="count"></span>
  <span class="sp"></span>
  <button class="btn" id="bRand">🎲 隨機抽一個</button>
  <a class="btn ghost" href="index.html">首頁</a>
</div></header>
<main id="main"></main>
<div id="pick" class="hidden"><div class="pbox">
  <div class="lb" id="pLb">抽到了！</div>
  <img id="pImg" alt="">
  <div class="row"><a class="btn" id="pGo">開始 ▶</a><button class="btn ghost" id="pAgain">再抽一次</button><button class="btn ghost" id="pClose">關閉</button></div>
</div></div>
<script>

mg": "img/acts/62.jpg", "t": 4}, {"n": 63, "label": "十鼓文化園區", "img": "img/acts/63.jpg", "t": 4}, {"n": 64, "label": "第二兒發\n蒞校參觀", "img": "img/acts/64.jpg", "t": 4}, {"n": 65, "label": "故宮南院", "img": "img/acts/65.jpg", "t": 5}, {"n": 66, "label": "娉茵鋒昀\n大三見習", "img": "img/acts/66.jpg", "t": 5}, {"n": 67, "label": "學習提袋", "img": "img/acts/67.jpg", "t": 5}, {"n": 68, "label": "Anping共融\n洋行新展", "img": "img/acts/68.jpg", "t": 5}, {"n": 69, "label": "書營之間\n兩全皆美", "img": "img/acts/69.jpg", "t": 5}, {"n": 70, "label": "增Resource\n設 one clsss", "img": "img/acts/70.jpg", "t": 5}, {"n": 71, "label": "綁烤拼曬\n生命壯遊", "img": "img/acts/71.jpg", "t": 5}, {"n": 72, "label": "市區街屋\n梅漢虎拜", "img": "img/acts/72.jpg", "t": 5}, {"n": 73, "label": "官田西拉雅\n南藝清水模", "img": "img/acts/73.jpg", "t": 5}];
const TABLES=['年表一','年表二','年表三','年表四','年表五'];
const $=id=>document.getElementById(id);
function visited(){try{return JSON.parse(localStorage.getItem('acts-visited')||'[]')}catch(e){return[]}}
function render(){
  const v=visited(),main=$('main');main.innerHTML='';
  TABLES.forEach((t,ti)=>{
    const h=document.createElement('h2');h.textContent=t;main.appendChild(h);
    const g=document.createElement('div');g.className='grid';
    ACTS.filter(a=>a.t===ti+1).forEach(a=>{
      const el=document.createElement('a');el.className='act'+(v.includes(a.n)?' seen':'');el.href='talk.html?a='+a.n;el.dataset.n=a.n;
      el.setAttribute('aria-label',a.label.replace(/\n/g,' '));el.title=a.label.replace(/\n/g,' ');
      const im=document.createElement('img');im.src=a.img;im.alt=a.label.replace(/\n/g,' ');im.loading='lazy';
      const no=document.createElement('span');no.className='no';no.textContent=a.n;
      el.append(im,no);g.appendChild(el)});
    main.appendChild(g)});
  const f=document.createElement('div');f.className='foot';
  f.innerHTML='<a class="btn ghost" href="talk.html?a=end">結尾・THANKS</a><button class="btn ghost" id="bReset">清除「看過」記號</button>';
  main.appendChild(f);
  $('bReset').onclick=()=>{try{localStorage.removeItem('acts-visited')}catch(e){};render()};
  $('count').textContent=`共 ${ACTS.length} 個活動・已看 ${v.filter(n=>n>=1&&n<=ACTS.length).length} 個`;
}
let rolling=false;
function roll(){
  if(rolling)return;rolling=true;$('pick').classList.add('hidden');
  const v=visited();let pool=ACTS.filter(a=>!v.includes(a.n));if(!pool.length)pool=ACTS;
  const win=pool[Math.floor(Math.random()*pool.length)];
  const tiles=[...document.querySelectorAll('.act')];let i=0,delay=60;const total=22;let prev=null;
  (function tick(){
    prev&&prev.classList.remove('hot');
    const el=i>=total?tiles.find(t=>+t.dataset.n===win.n):tiles[Math.floor(Math.random()*tiles.length)];
    el.classList.add('hot');el.scrollIntoView({block:'nearest',behavior:'smooth'});prev=el;i++;
    if(i<=total){delay*=1.1;setTimeout(tick,delay);return}
    setTimeout(()=>{el.classList.remove('hot');rolling=false;
      $('pImg').src=win.img;$('pImg').alt=win.label;$('pLb').textContent=`抽到了！第 ${win.n} 個活動`;
      $('pGo').href='talk.html?a='+win.n;$('pick').classList.remove('hidden')},500)})();
}
$('bRand').onclick=roll;$('pAgain').onclick=roll;
$('pClose').onclick=()=>$('pick').classList.add('hidden');
addEventListener('pageshow',render);
render();
</script>
</body>
</html>
