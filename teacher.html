<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講師控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{--cream:#f8f2e4;--paper:#fffaf0;--pink:#ecc7bd;--sage:#d9e3c5;--ink:#3a3330;--red:#c0392b;--muted:#7d716a;--line:rgba(58,51,48,.14);--ok:#3c8d5a;
  --sun:#f4b63f;--sunbg:#fff4d6;--moon:#5b6fa8;--moonbg:#e7ebf7}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--cream);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:18px}

.top{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--paper);border-radius:22px;padding:18px 22px;box-shadow:0 6px 18px rgba(58,51,48,.1)}
#qr{background:#fff;padding:8px;border-radius:10px;width:156px;height:156px}
#qr img,#qr canvas{width:140px!important;height:140px!important}
.room .lb{color:var(--muted);font-size:16px}
.room .code{font-family:"Noto Sans TC";font-weight:900;font-size:clamp(54px,8vw,92px);letter-spacing:.12em;color:var(--red);line-height:1.05}
.room .url{font-size:14px;color:var(--muted);word-break:break-all;margin-top:4px}
.net{font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin-top:6px}
.net::before{content:"";width:10px;height:10px;border-radius:50%;background:#d1a23a}
.net.on::before{background:var(--ok)} .net.off::before{background:var(--red)}
.stats{display:flex;gap:14px}
.stat{background:#fff;border-radius:16px;padding:12px 20px;text-align:center;min-width:110px}
.stat b{display:block;font-size:44px;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:12px 24px;font-size:18px;font-weight:700;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(192,57,43,.25)}
.btn:disabled{background:#c9bfb7;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(58,51,48,.12);font-size:15px;padding:9px 18px}
.btn.big{font-size:22px;padding:14px 34px}
.bar .sp{flex:1}
.legend{position:relative}
.legend .tip{position:absolute;right:0;top:calc(100% + 6px);background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;white-space:nowrap;z-index:5}

h2{font-size:20px;margin-bottom:10px}
.panel{background:var(--paper);border-radius:20px;padding:18px 20px;box-shadow:0 6px 18px rgba(58,51,48,.08)}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{position:relative;background:#fff;border-radius:12px;padding:10px 12px;border:2px solid transparent;display:flex;flex-direction:column;gap:3px}
.st .id{font-weight:900;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.st .id::before{content:"";width:8px;height:8px;border-radius:50%;background:#ccc;flex:none}
.st.online .id::before{background:var(--ok)}
.st .s{font-size:13px;color:var(--muted)}
.st.done{border-color:#b9d3a6;background:#f3f8ee}
.st.done .s{color:var(--ok);font-weight:700}
.st.sun{border-color:var(--sun);background:var(--sunbg)}
.st.moon{border-color:var(--moon);background:var(--moonbg)}
.st .x{position:absolute;right:6px;top:4px;border:0;background:none;color:#b5aaa2;font-size:16px;cursor:pointer;display:none}
.st:hover .x{display:block}
.empty{color:var(--muted);font-size:15px;padding:8px 0}

.groups{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.group{border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;border:4px solid transparent;cursor:pointer;transition:transform .15s}
.group:hover{transform:translateY(-3px)}
.group.sun{background:var(--sunbg);border-color:var(--sun)}
.group.moon{background:var(--moonbg);border-color:var(--moon)}
.group .gh{display:flex;align-items:center;gap:12px}
.group .gi{font-size:56px;line-height:1}
.group .gn{font-family:"Noto Serif TC",serif;font-size:34px}
.group .gc{margin-left:auto;font-size:18px;font-weight:700}
.group .ids{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.group .ids span{background:#fff;border-radius:8px;padding:3px 10px;font-weight:700}
.group .ids span.won{text-decoration:line-through;opacity:.5}
.group .draw{align-self:flex-start}
.group.sun .draw{background:#d9921c} .group.moon .draw{background:var(--moon)}

/* raffle */
#raffle{position:fixed;inset:0;background:rgba(30,26,24,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.rbox{background:var(--paper);border-radius:28px;padding:30px 34px;width:min(620px,100%);text-align:center;display:flex;flex-direction:column;gap:18px;border:6px solid var(--sun)}
.rbox.moon{border-color:var(--moon)}
.rbox .rt{font-family:"Noto Serif TC",serif;font-size:32px}
.rname{font-family:"Noto Sans TC";font-weight:900;font-size:clamp(60px,14vw,120px);letter-spacing:.06em;min-height:1.3em;line-height:1.3;color:var(--ink)}
.rname.win{color:var(--red);animation:win .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes win{from{transform:scale(.5)}to{transform:none}}
.rbox label{font-size:15px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.rbox .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.winners{font-size:15px;color:var(--muted)}
.winners b{color:var(--ink)}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

dialog{border:0;border-radius:20px;padding:26px 24px;max-width:380px;width:calc(100% - 32px);box-shadow:0 20px 50px rgba(0,0,0,.3);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(30,26,24,.55)}
dialog p{font-size:18px;line-height:1.6;margin-bottom:18px;text-align:center;white-space:pre-line}
dialog .row{display:flex;gap:10px;justify-content:center}

@media (max-width:820px){
  .top{grid-template-columns:1fr;justify-items:center;text-align:center}
  .groups{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="top">
    <div id="qr"></div>
    <div class="room">
      <div class="lb">學員請到「活動」頁或掃描 QR code，輸入房間代碼：</div>
      <div class="code" id="code">----</div>
      <div class="url" id="url"></div>
      <div class="net" id="net">啟動中…</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="nJoin">0</b><span>已加入</span></div>
      <div class="stat"><b id="nDone">0</b><span>已完成</span></div>
    </div>
  </section>

  <div class="bar">
    <button class="btn big" id="btnGrade" disabled>對答案</button>
    <span class="sp"></span>
    <span class="legend"><button class="btn ghost" id="btnLegend" title="組別說明（只有講師看）">?</button><span class="tip hidden" id="tip">☀️ 太陽組＝全部答對　🌙 月亮組＝未完全答對</span></span>
    <button class="btn ghost" id="btnNew">開新的一場</button>
    <a class="btn ghost" href="index.html" style="text-decoration:none">首頁</a>
  </div>

  <section class="groups hidden" id="groups">
    <div class="group sun" data-g="sun">
      <div class="gh"><span class="gi">☀️</span><span class="gn">太陽組</span><span class="gc" id="cSun"></span></div>
      <div class="ids" id="idsSun"></div>
      <button class="btn draw">抽獎</button>
    </div>
    <div class="group moon" data-g="moon">
      <div class="gh"><span class="gi">🌙</span><span class="gn">月亮組</span><span class="gc" id="cMoon"></span></div>
      <div class="ids" id="idsMoon"></div>
      <button class="btn draw">抽獎</button>
    </div>
  </section>

  <section class="panel">
    <h2>學員作答狀況</h2>
    <div class="students" id="students"></div>
  </section>
</div>

<div id="raffle" class="hidden">
  <div class="rbox" id="rbox">
    <div class="rt" id="rTitle"></div>
    <div class="rname" id="rName">?</div>
    <label><input type="checkbox" id="rNoRepeat" checked> 已中獎的人不再抽</label>
    <div class="row">
      <button class="btn big" id="rGo">開始抽！</button>
      <button class="btn ghost" id="rClose">關閉</button>
    </div>
    <div class="winners" id="rWinners"></div>
  </div>
</div>

<dialog id="dlg"><p id="dlgText"></p><div class="row" id="dlgRow"></div></dialog>

<script src="lib/peerjs.min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="goals-data.js"></script>
<script>
const N = GOALS.length;
const $ = id => document.getElementById(id);
const KEY = 'goals-teacher-v1';
const GROUP = { sun: { icon: '☀️', name: '太陽組' }, moon: { icon: '🌙', name: '月亮組' } };

let T = load() || fresh();
let peer = null, takenTries = 0;
const online = new Map(); // sid -> Set(conn)

function fresh(){ return { code: String(Math.floor(1000 + Math.random() * 9000)), students: {}, graded: false, winners: { sun: [], moon: [] } }; }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(T)); }catch(e){} }
function groupOf(st){ return st.status === 'done' ? (isAllCorrect(st.ans) ? 'sun' : 'moon') : null; }
const byId = (a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true });

function ask(text, buttons){
  return new Promise(res => {
    $('dlgText').textContent = text; const row = $('dlgRow'); row.innerHTML = '';
    buttons.forEach(([label, val, cls]) => { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label;
      b.onclick = () => { $('dlg').close(); res(val); }; row.appendChild(b); });
    $('dlg').showModal();
  });
}

/* ---------- render ---------- */
function studentUrl(){
  const u = new URL('activity.html', location.href);
  u.search = ''; u.hash = '';
  const q = new URLSearchParams(location.search); // keep test-server params if any
  ['peerhost','peerport','peerpath','peersecure'].forEach(k => q.get(k) && u.searchParams.set(k, q.get(k)));
  u.searchParams.set('room', T.code);
  return u.toString();
}
function renderTop(){
  $('code').textContent = T.code;
  const url = studentUrl();
  $('url').textContent = url;
  $('qr').innerHTML = '';
  try { new QRCode($('qr'), { text: url, width: 140, height: 140, correctLevel: QRCode.CorrectLevel.M }); } catch(e){}
}
function render(){
  const ids = Object.keys(T.students).sort(byId);
  const done = ids.filter(id => T.students[id].status === 'done');
  $('nJoin').textContent = ids.length; $('nDone').textContent = done.length;
  $('btnGrade').disabled = !done.length;
  $('btnGrade').textContent = T.graded ? '重新整理分組' : '對答案';

  const box = $('students'); box.innerHTML = '';
  if (!ids.length) { box.innerHTML = '<div class="empty">還沒有學員加入。</div>'; }
  ids.forEach(id => {
    const st = T.students[id];
    const el = document.createElement('div');
    const g = T.graded ? groupOf(st) : null;
    el.className = 'st' + (online.has(id) ? ' online' : '') + (st.status === 'done' ? ' done' : '') + (g ? ' ' + g : '');
    const nm = document.createElement('div'); nm.className = 'id'; nm.textContent = id + (g ? ' ' + GROUP[g].icon : '');
    const s = document.createElement('div'); s.className = 's';
    s.textContent = st.status === 'done' ? '✔ 已完成' : `作答中 ${st.n || 0}/${N}`;
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.title = '刪除這位學員';
    x.onclick = async () => { if (await ask(`刪除學號 ${id} 的紀錄？\n（例如學號打錯時使用）`, [['取消', false, 'ghost'], ['刪除', true]])) { delete T.students[id]; save(); render(); } };
    el.append(nm, s, x); box.appendChild(el);
  });

  $('groups').classList.toggle('hidden', !T.graded);
  if (T.graded) {
    ['sun', 'moon'].forEach(g => {
      const list = done.filter(id => groupOf(T.students[id]) === g);
      const cap = g === 'sun' ? 'Sun' : 'Moon';
      $('c' + cap).textContent = list.length + ' 人';
      const wrap = $('ids' + cap); wrap.innerHTML = '';
      if (!list.length) wrap.innerHTML = '<span style="background:none;color:var(--muted);font-weight:400">（沒有人）</span>';
      list.forEach(id => { const sp = document.createElement('span'); sp.textContent = id; if (T.winners[g].includes(id)) sp.className = 'won'; wrap.appendChild(sp); });
    });
  }
}

/* ---------- network ---------- */
function setNet(state, text){ const n = $('net'); n.className = 'net ' + state; n.textContent = text; }
function startPeer(){
  if (peer) { try { peer.destroy(); } catch(e){} }
  setNet('', '啟動中…');
  peer = new Peer(ROOM_PREFIX + T.code, peerOptions());
  peer.on('open', () => { takenTries = 0; setNet('on', '已就緒，等待學員連線'); });
  peer.on('connection', handleConn);
  peer.on('disconnected', () => { setNet('off', '與伺服器斷線，重新連線中…'); setTimeout(() => { try { peer.reconnect(); } catch(e){} }, 2000); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') {
      // 剛重新整理時舊連線可能還沒釋放；多試幾次，仍被占用就換代碼
      takenTries++;
      if (takenTries <= 4) { setNet('off', '房間代碼準備中…'); setTimeout(startPeer, 3000); }
      else { setNet('off', '代碼被占用，已換新代碼'); T.code = fresh().code; save(); renderTop(); takenTries = 0; setTimeout(startPeer, 500); }
    } else if (err.type === 'peer-unavailable') { /* ignore */ }
    else if (['network','server-error','socket-error','socket-closed'].includes(err.type)) { setNet('off', '網路連線失敗，重試中…'); setTimeout(startPeer, 4000); }
    else { setNet('off', '連線錯誤：' + err.type); }
  });
}
function handleConn(conn){
  let sid = null;
  const validSid = s => typeof s === 'string' && /^[A-Za-z0-9\-_]{1,20}$/.test(s);
  conn.on('data', d => {
    if (!d || typeof d !== 'object' || !validSid(d.sid)) return;
    if (sid !== d.sid) {
      if (sid) online.get(sid)?.delete(conn);
      sid = d.sid;
      if (!online.has(sid)) online.set(sid, new Set());
      online.get(sid).add(conn);
    }
    let st = T.students[sid];
    if (!st) st = T.students[sid] = { status: 'doing', n: 0, ans: null, t: Date.now() };
    if (d.t === 'hello') {
      if (st.status !== 'done') st.n = Math.max(0, Math.min(N, +d.n || 0));
      conn.send({ t: 'welcome', done: st.status === 'done' });
    } else if (d.t === 'progress') {
      if (st.status !== 'done') st.n = Math.max(0, Math.min(N, +d.n || 0));
    } else if (d.t === 'submit') {
      if (st.status === 'done') conn.send({ t: 'reject' });
      else {
        const ok = Array.isArray(d.ans) && d.ans.length === N && d.ans.every(v => Number.isInteger(v) && v >= 0 && v < N) && new Set(d.ans).size === N;
        if (!ok) return;
        st.status = 'done'; st.ans = d.ans; st.n = N; st.doneAt = Date.now();
        conn.send({ t: 'ack' });
      }
    }
    save(); render();
  });
  conn.on('close', () => { if (sid) { const s = online.get(sid); s?.delete(conn); if (s && !s.size) online.delete(sid); } render(); });
}

/* ---------- actions ---------- */
$('btnGrade').addEventListener('click', async () => {
  const ids = Object.keys(T.students);
  const notDone = ids.filter(id => T.students[id].status !== 'done');
  if (!T.graded && notDone.length) {
    const go = await ask(`還有 ${notDone.length} 位學員尚未完成：\n${notDone.sort(byId).join('、')}\n\n確定要現在對答案嗎？`, [['再等等', false, 'ghost'], ['對答案', true]]);
    if (!go) return;
  }
  T.graded = true; save(); render();
  $('groups').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('btnLegend').addEventListener('click', () => $('tip').classList.toggle('hidden'));
$('btnNew').addEventListener('click', async () => {
  const go = await ask('開新的一場？\n目前所有學員的作答紀錄與抽獎紀錄都會清除，並產生新的房間代碼。', [['取消', false, 'ghost'], ['清除並開新場', true]]);
  if (!go) return;
  T = fresh(); save(); online.clear(); renderTop(); render(); startPeer();
});

/* ---------- raffle ---------- */
let rGroup = null, rolling = false;
document.querySelectorAll('.group').forEach(el => el.addEventListener('click', () => openRaffle(el.dataset.g)));
function pool(){
  const list = Object.keys(T.students).filter(id => groupOf(T.students[id]) === rGroup);
  return $('rNoRepeat').checked ? list.filter(id => !T.winners[rGroup].includes(id)) : list;
}
function openRaffle(g){
  rGroup = g;
  $('rbox').className = 'rbox ' + g;
  $('rTitle').textContent = GROUP[g].icon + ' ' + GROUP[g].name + ' 抽獎';
  $('rName').textContent = '?'; $('rName').classList.remove('win');
  updateRaffle();
  $('raffle').classList.remove('hidden');
}
function updateRaffle(){
  const p = pool();
  $('rGo').disabled = rolling || !p.length;
  $('rGo').textContent = p.length ? '開始抽！' : '沒有可抽的人';
  const w = T.winners[rGroup];
  $('rWinners').innerHTML = '';
  if (w.length) { $('rWinners').append('已中獎：'); const b = document.createElement('b'); b.textContent = w.join('、'); $('rWinners').appendChild(b); }
}
$('rNoRepeat').addEventListener('change', updateRaffle);
$('rClose').addEventListener('click', () => { if (!rolling) { $('raffle').classList.add('hidden'); render(); } });
$('rGo').addEventListener('click', () => {
  const p = pool(); if (!p.length || rolling) return;
  rolling = true; updateRaffle();
  const winner = p[Math.floor(Math.random() * p.length)];
  const nm = $('rName'); nm.classList.remove('win');
  let i = 0, delay = 50; const total = 28 + Math.floor(Math.random() * 6);
  (function tick(){
    i++;
    nm.textContent = i >= total ? winner : p[Math.floor(Math.random() * p.length)];
    if (i < total) { delay *= 1.09; setTimeout(tick, delay); return; }
    nm.classList.add('win');
    if (!T.winners[rGroup].includes(winner)) T.winners[rGroup].push(winner);
    save(); rolling = false; updateRaffle(); render(); confetti();
  })();
});
function confetti(){
  const colors = ['#c0392b', '#f4b63f', '#5b6fa8', '#3c8d5a', '#ecc7bd'];
  for (let k = 0; k < 70; k++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[k % colors.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's'; c.style.animationDelay = (Math.random() * .4) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}

renderTop(); render(); startPeer();
</script>
</body>
</html>
